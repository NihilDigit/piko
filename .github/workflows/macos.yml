name: macOS Desktop

on:
  push:
    branches: [main]
    # tag 构建把版本号喂给 DMG，并挂到 Android release.yml 建的 GitHub Release 上。
    tags:
      - 'v*'
  pull_request:

concurrency:
  group: macos-desktop-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  macos:
    # Apple Silicon。jpackage 不能交叉构建，Intel Mac 要另起 macos-15-intel runner，暂不出
    runs-on: macos-15
    permissions:
      # tag 构建要往 Release 挂安装包。
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # 与 Windows 相同用 Zulu：打包的 jlink 与 ProGuard 要 jmods，见 desktop.yml
      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: zulu

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Derive desktop version from tag
        run: |
          if [[ "$GITHUB_REF_TYPE" == "tag" && "$GITHUB_REF_NAME" =~ ^v([0-9]+)\.([0-9]+)\.([0-9]+)$ ]]; then
            echo "PIKO_DESKTOP_VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"
            echo "ORG_GRADLE_PROJECT_pikoDesktopVersion=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"
          else
            echo "PIKO_DESKTOP_VERSION=1.0.0" >> "$GITHUB_ENV"
          fi

      # 测试已在 Windows 与 Linux 上跑过，这里只验证能打出包
      - name: Build DMG
        run: ./gradlew :desktopApp:packageReleaseDmg --no-daemon --stacktrace

      - name: Verify classes
        run: java -Xverify:all desktopApp/package/VerifyClasses.java desktopApp/build/compose/binaries/main-release/app/Piko.app/Contents/app

      - name: Stage DMG
        run: |
          set -euo pipefail
          dmg=$(ls desktopApp/build/compose/binaries/main-release/dmg/*.dmg | head -n 1)
          mkdir -p dist
          cp "$dmg" "dist/piko-macos-arm64-$PIKO_DESKTOP_VERSION.dmg"
          # 没有开发者证书，包未经正式签名；把签名状态打印出来，Gatekeeper 报错时对照
          codesign -dv desktopApp/build/compose/binaries/main-release/app/Piko.app 2>&1 || true
          ls -l dist

      - name: Upload DMG
        uses: actions/upload-artifact@v4
        with:
          name: piko-macos-arm64-dmg
          path: dist/*.dmg
          if-no-files-found: error

      - name: Attach DMG to GitHub Release
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Release 由 Android release.yml 创建，这里等它出现（最多等 5 分钟）再挂附件。
          for i in $(seq 1 10); do
            gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 && break
            sleep 30
          done
          gh release upload "$GITHUB_REF_NAME" dist/*.dmg --clobber
