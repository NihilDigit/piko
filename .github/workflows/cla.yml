# 外部贡献者在 PR 下回复指定语句即签署 CLA（CLA.md），签名存于 cla-signatures 分支的 signatures/version1/cla.json。
# 采用 Lite 版 Action 而非 cla-assistant.io：签名留在本仓库，不依赖外部服务。
# pull_request_target 带写权限并在基础分支上运行，因此不检出、不运行 PR 的代码，Action 按提交 SHA 固定。
name: CLA

on:
  issue_comment:
    types: [created]
  pull_request_target:
    types: [opened, closed, synchronize]

permissions:
  actions: write
  contents: write
  pull-requests: write
  statuses: write

jobs:
  cla:
    runs-on: ubuntu-latest
    steps:
      - name: CLA Assistant
        if: >-
          github.event.comment.body == 'recheck' ||
          github.event.comment.body == 'I have read the CLA Document and I hereby sign the CLA' ||
          github.event_name == 'pull_request_target'
        # v2.6.1
        uses: contributor-assistant/github-action@ca4a40a7d1004f18d9960b404b97e5f30a505a08
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          path-to-signatures: signatures/version1/cla.json
          path-to-document: https://github.com/NihilDigit/piko/blob/main/CLA.md
          branch: cla-signatures
          allowlist: NihilDigit,dependabot[bot],renovate[bot]
