name: Test

# 全部测试。日常提交按改动路径精准触发受影响模块；手动触发与发版（workflow_call）强制跑全量。
#
# 两类：
# - 业务逻辑的单测放在 JVM 上：shared 与 ui 的 desktop 测试（Linux 上最快）、
#   desktopApp 的原生单测（WinRT、窗口过程、更新清单，Windows 专属）、Android 单测、macOS 钥匙串实测。
# - 原生行为与安装包冒烟在真系统上：Android 模拟器（libmpv 与回环代理）；iOS 模拟器（原生单测、Swift 宿主链接与冷启动）；
#   Windows、macOS 与 Linux 上真装、真启动、真应用内更新及系统集成（windows-package、windows-legacy-upgrade、
#   windows-2022-portable、macos-package、linux-package）。
#
# 分支开发由 pull_request 触发，合并或直推由 main 的 push 触发，避免同一提交触发 push + PR 双跑；
# 桌面三端安装包冒烟仅在手动触发或发版门控时运行。

on:
  push:
    branches: ['main']
  pull_request:
  workflow_dispatch:
    inputs:
      desktop:
        description: 同时跑桌面端的安装与更新冒烟
        type: boolean
        default: true
      sdk-main:
        description: 使用 SDK main 源码（关闭则使用已发布版本）
        type: boolean
        default: true
  workflow_call:
    inputs:
      desktop:
        type: boolean
        default: true
      # 发版时用 libs.versions.toml 里已发布的 SDK，与正式构建一致；日常开发用 SDK main 源码做复合构建。
      # 各步骤按 format('{0}', inputs.sdk-main) != 'false' 判断，兼容 push / PR 下 inputs.sdk-main 为 null 的情形。
      sdk-main:
        type: boolean
        default: true
      full:
        type: boolean
        default: true

concurrency:
  group: ${{ github.workflow }}-test-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: ${{ github.event_name == 'push' || github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  # 发版与手动触发无条件全开；日常 push / PR 识别纯文档或单端改动，跳过无关平台的重型队列（尤其是 macOS）。
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      jvm: ${{ steps.filter.outputs.jvm }}
      desktop_unit: ${{ steps.filter.outputs.desktop_unit }}
      macos_keychain: ${{ steps.filter.outputs.macos_keychain }}
      ios: ${{ steps.filter.outputs.ios }}
      android: ${{ steps.filter.outputs.android }}
    steps:
      - uses: actions/checkout@v5
        if: github.event_name == 'push' || github.event_name == 'pull_request'

      - name: Detect affected targets
        id: filter
        env:
          EVENT_NAME: ${{ github.event_name }}
          FORCE_FULL: ${{ inputs.full == true }}
          BASE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
        shell: bash
        run: |
          set -euo pipefail
          enable_all() {
            for key in jvm desktop_unit macos_keychain ios android; do
              echo "$key=true" >> "$GITHUB_OUTPUT"
            done
            exit 0
          }
          if [[ "$EVENT_NAME" != 'push' && "$EVENT_NAME" != 'pull_request' ]] || [[ "$FORCE_FULL" == 'true' ]]; then
            enable_all
          fi
          if [[ -z "$BASE_SHA" || "$BASE_SHA" =~ ^0+$ ]]; then
            enable_all
          fi
          if ! git fetch --no-tags --depth=1 origin "$BASE_SHA" 2>/dev/null; then
            enable_all
          fi
          CHANGED=$(git diff --no-renames --name-only "$BASE_SHA" HEAD || true)
          if [[ -z "$CHANGED" ]]; then
            enable_all
          fi
          echo "Changed files:"
          echo "$CHANGED"
          CHANGED_FILES="$CHANGED" python3 - <<'PY'
          import fnmatch, os

          files = [line.strip() for line in os.environ["CHANGED_FILES"].splitlines() if line.strip()]
          doc_patterns = (
              "README*.md", "LICENSE", "CLA.md", "docs/*", "docs/**", "AGENTS.md", "*/AGENTS.md", "**/AGENTS.md",
              ".github/changelogs/*", ".github/release-notes.md", ".github/ISSUE_TEMPLATE/*",
              ".github/PULL_REQUEST_TEMPLATE*", ".github/workflows/cla.yml",
              ".github/workflows/release.yml", ".github/workflows/ios-ipa.yml", ".github/scripts/render-changelog.py",
          )
          global_patterns = (
              "gradle/*", "gradle/**", "gradlew*", "build.gradle.kts", "settings.gradle.kts",
              "gradle.properties", ".github/workflows/test.yml",
          )

          def matches(path, patterns):
              return any(fnmatch.fnmatch(path, pat) for pat in patterns)

          flags = {k: False for k in ("jvm", "desktop_unit", "macos_keychain", "ios", "android")}
          for f in files:
              if matches(f, doc_patterns) or f.endswith("/AGENTS.md"):
                  continue
              if matches(f, global_patterns):
                  for k in flags:
                      flags[k] = True
                  break
              if f.startswith(("iosApp/", "shared/src/iosMain/", "shared/src/nativeInterop/", "ui/src/iosMain/")) or f == ".github/workflows/ios-native.yml":
                  flags["ios"] = True
              elif f.startswith(("app/", "shared/src/androidMain/", "ui/src/androidMain/")):
                  flags["android"] = True
              elif f.startswith("desktopApp/"):
                  flags["jvm"] = True
                  flags["desktop_unit"] = True
              elif f.startswith("shared/src/desktopMain/"):
                  flags["jvm"] = True
                  flags["desktop_unit"] = True
                  flags["macos_keychain"] = True
              elif f.startswith("ui/src/desktopMain/") or f.startswith(("cli/", "shots/")):
                  flags["jvm"] = True
                  flags["desktop_unit"] = True
              elif f.startswith("shared/src/jvmSharedMain/"):
                  flags["jvm"] = True
                  flags["desktop_unit"] = True
                  flags["macos_keychain"] = True
                  flags["android"] = True
              else:
                  for k in flags:
                      flags[k] = True
                  break

          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as out:
              for k, v in flags.items():
                  line = f"{k}={'true' if v else 'false'}"
                  print(" ->", line)
                  out.write(line + "\n")
          PY

  jvm:
    needs: [changes]
    if: needs.changes.outputs.jvm == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - uses: actions/checkout@v5
        if: format('{0}', inputs.sdk-main) != 'false'
        with:
          repository: NihilDigit/pikpak-kotlin
          path: pikpak-kotlin

      - name: Build against the SDK source
        if: format('{0}', inputs.sdk-main) != 'false'
        shell: bash
        run: echo "pikpak.sdk.dir=pikpak-kotlin" >> local.properties

      - uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: temurin

      - uses: gradle/actions/setup-gradle@v5

      - name: Shared smoke tests
        run: ./gradlew :shared:desktopTest :ui:desktopTest --no-daemon --stacktrace

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: jvm-smoke-reports
          path: |
            shared/build/reports/tests/
            ui/build/reports/tests/
          if-no-files-found: ignore

  # WinRT、窗口过程、更新清单与 Windows 原生库的用例只能在 Windows 上跑
  desktop-unit:
    needs: [changes]
    if: needs.changes.outputs.desktop_unit == 'true'
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - uses: actions/checkout@v5
        if: format('{0}', inputs.sdk-main) != 'false'
        with:
          repository: NihilDigit/pikpak-kotlin
          path: pikpak-kotlin

      - name: Build against the SDK source
        if: format('{0}', inputs.sdk-main) != 'false'
        shell: bash
        run: echo "pikpak.sdk.dir=pikpak-kotlin" >> local.properties

      - uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: zulu

      # 停在 v5 的理由见 release.yml
      - uses: gradle/actions/setup-gradle@v5

      - name: Test
        id: test
        shell: pwsh
        run: |
          .\gradlew.bat :desktopApp:desktopTest --stacktrace
          if ($LASTEXITCODE -ne 0) {
            Write-Warning "desktopTest failed on first attempt (exit $LASTEXITCODE), archiving report and retrying..."
            "retried=true" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
            if (Test-Path desktopApp/build/reports/tests) {
              Copy-Item desktopApp/build/reports/tests desktopApp/build/reports/tests-attempt1 -Recurse -Force
            }
            .\gradlew.bat :desktopApp:desktopTest --stacktrace --rerun-tasks
          }

      - name: Upload test report
        if: failure() || steps.test.outputs.retried == 'true'
        uses: actions/upload-artifact@v6
        with:
          name: desktop-test-report
          path: |
            desktopApp/build/reports/tests
            desktopApp/build/reports/tests-attempt1
          if-no-files-found: ignore
          retention-days: 7

  # 凭据存进钥匙串的行为（-U 覆盖、-i 的行长上限、锁着时的退出码）只能在真实的 macOS 上验
  macos-keychain:
    needs: [changes]
    if: needs.changes.outputs.macos_keychain == 'true'
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      - uses: actions/checkout@v5
        if: format('{0}', inputs.sdk-main) != 'false'
        with:
          repository: NihilDigit/pikpak-kotlin
          path: pikpak-kotlin

      - name: Build against the SDK source
        if: format('{0}', inputs.sdk-main) != 'false'
        shell: bash
        run: echo "pikpak.sdk.dir=pikpak-kotlin" >> local.properties

      - uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: zulu

      - uses: gradle/actions/setup-gradle@v5

      - name: Keychain tests
        run: ./gradlew :shared:desktopTest --tests '*MacKeychainVaultTest*' --no-daemon --stacktrace

      # 锁着的钥匙串报什么退出码与错误要记下来，成败都打出测试的标准输出
      - name: Print test output
        if: always()
        run: cat shared/build/test-results/desktopTest/TEST-*MacKeychainVaultTest*.xml || true

  # iOS 原生编译链接、SQLite 系统库绑定、模拟器单测与 iOS 15 部署目标宿主冷启动（复用 ios-native.yml）
  ios-simulator:
    needs: [changes]
    if: needs.changes.outputs.ios == 'true'
    uses: ./.github/workflows/ios-native.yml
    with:
      sdk-main: ${{ format('{0}', inputs.sdk-main) != 'false' }}

  android-unit:
    needs: [changes]
    if: needs.changes.outputs.android == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - uses: actions/checkout@v5
        if: format('{0}', inputs.sdk-main) != 'false'
        with:
          repository: NihilDigit/pikpak-kotlin
          path: pikpak-kotlin

      - name: Build against the SDK source
        if: format('{0}', inputs.sdk-main) != 'false'
        shell: bash
        run: echo "pikpak.sdk.dir=pikpak-kotlin" >> local.properties

      - uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: temurin

      - uses: gradle/actions/setup-gradle@v5

      - name: Test
        run: ./gradlew :app:testDebugUnitTest --no-daemon --stacktrace

      - name: Upload test report
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: android-test-report
          path: app/build/reports/tests
          retention-days: 7

  android:
    # 模拟器是 x86_64，验证的是 libmpv 的 x86_64 .so；arm64 与 x86_64 出自同一套构建脚本，
    # 打包或格式覆盖出问题时两者一起坏，差异只在机型硬解，这部分 CI 本来就测不到。
    needs: [changes]
    if: needs.changes.outputs.android == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      # 34 覆盖前台服务类型、后台启动限制等新平台行为
      API_LEVEL: 34
    steps:
      - uses: actions/checkout@v5

      - uses: actions/checkout@v5
        if: format('{0}', inputs.sdk-main) != 'false'
        with:
          repository: NihilDigit/pikpak-kotlin
          path: pikpak-kotlin

      - name: Build against the SDK source
        if: format('{0}', inputs.sdk-main) != 'false'
        shell: bash
        run: echo "pikpak.sdk.dir=pikpak-kotlin" >> local.properties

      - uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: temurin

      - uses: gradle/actions/setup-gradle@v5

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Build test APKs
        # 先在模拟器外编好，模拟器启动的那段时间不被 Gradle 占着
        run: ./gradlew :app:assembleDebug :app:assembleDebugAndroidTest -Ppiko.enableAbiSplits=false --no-daemon --stacktrace

      - name: AVD cache
        uses: actions/cache@v5
        id: avd-cache
        with:
          path: |
            ~/.android/avd/*
            ~/.android/adb*
          key: avd-${{ env.API_LEVEL }}-x86_64-v1

      - name: Create AVD snapshot
        if: steps.avd-cache.outputs.cache-hit != 'true'
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ env.API_LEVEL }}
          arch: x86_64
          target: default
          force-avd-creation: false
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: false
          script: echo "AVD snapshot created"

      - name: Instrumented smoke tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ env.API_LEVEL }}
          arch: x86_64
          target: default
          force-avd-creation: false
          emulator-options: -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          script: ./gradlew :app:connectedDebugAndroidTest -Ppiko.enableAbiSplits=false --no-daemon --stacktrace

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: android-smoke-reports-api${{ env.API_LEVEL }}
          path: |
            app/build/reports/androidTests/
            app/build/outputs/androidTest-results/
          if-no-files-found: ignore

  # 全新安装与应用内更新：同一份源码打两个版本（9.9.0 与 9.9.1），装旧的、让它自己更新成新的，
  # 逐文件核对落盘结果。装好之后顺带验依赖系统真实行为的：设为 magnet 与 .torrent 的默认打开方式，
  # 系统真把链接交给 Piko，在资源管理器中显示下载的文件（包里的自检见 desktopApp SelfTest.kt）。
  # 场景与断言见 desktopApp/package/package-smoke/windows.ps1。用测试专用的 UpgradeCode 与包名打，与正式版互不认识
  windows-package:
    if: inputs.desktop == true
    runs-on: windows-latest
    timeout-minutes: 90
    outputs:
      dist-uploaded: ${{ steps.upload-dist.outputs.artifact-id != '' }}
    env:
      SMOKE_UPGRADE_CODE: 5f3c2b1e-7a4d-4c9e-9b8a-2d6e0f1a3c55
      SMOKE_PACKAGE: PikoSmoke
    steps:
      - uses: actions/checkout@v5

      - uses: actions/checkout@v5
        if: format('{0}', inputs.sdk-main) != 'false'
        with:
          repository: NihilDigit/pikpak-kotlin
          path: pikpak-kotlin

      - name: Build against the SDK source
        if: format('{0}', inputs.sdk-main) != 'false'
        shell: bash
        run: echo "pikpak.sdk.dir=pikpak-kotlin" >> local.properties

      - uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: zulu

      - uses: gradle/actions/setup-gradle@v5

      - name: Install WiX Toolset
        continue-on-error: true
        run: choco install wixtoolset -y --no-progress

      # 造一份运行时也变了的场景：打完 9.9.0 后把它的清单里 runtime/release 的摘要改掉，9.9.1 拿这份改过的清单作
      # -PpikoUpdateBases，UpdateArtifactsTask 就把 runtime/release 也标进补丁包——便携版遇到运行时变更照样走补丁。
      # 真的 9.9.0 安装包与清单不动，装到磁盘上的仍是原文件
      - name: Build two versions
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $binaries = 'desktopApp/build/compose/binaries/main-release'
          $bases = "$env:RUNNER_TEMP/smoke-bases"
          foreach ($version in @('9.9.0', '9.9.1')) {
            $extra = @(if ($version -eq '9.9.1') { "-PpikoUpdateBases=$bases" })
            .\gradlew.bat :desktopApp:packageReleaseMsi :desktopApp:packageReleaseUpdate --no-daemon --stacktrace `
              "-PpikoDesktopVersion=$version" "-PpikoDesktopUpgradeUuid=$env:SMOKE_UPGRADE_CODE" "-PpikoDesktopPackageName=$env:SMOKE_PACKAGE" @extra
            if ($LASTEXITCODE -ne 0) { throw "build $version failed" }
            $out = "smoke-dist/$version"
            New-Item -ItemType Directory -Force -Path $out | Out-Null
            # 与 release.yml 的 Collect artifacts 同样的名字与打法，更新走的是同一条路。便携标记打完即删：
            # 下一轮的 MSI 从同一个应用目录打，留着它装出来的就成了便携版
            & .github/scripts/pack-portable.ps1 -AppDir "$binaries/app/$env:SMOKE_PACKAGE" -Output "$out/piko-windows-x64-$version.7z"
            # 按版本号取：上一轮的 MSI 可能还留在同一个目录里
            Copy-Item "$binaries/msi/$env:SMOKE_PACKAGE-$version.msi" "$out/piko-windows-x64-$version.msi"
            Copy-Item "$binaries/update/*" $out
            Get-ChildItem $out | Format-Table Name, Length
            if ($version -eq '9.9.0') {
              $manifest = Get-Content -Raw "$out/piko-windows-x64-$version-files.json" | ConvertFrom-Json
              ($manifest.files | Where-Object { $_.path -eq 'runtime/release' }).sha256 = '0' * 64
              New-Item -ItemType Directory -Force -Path $bases | Out-Null
              $manifest | ConvertTo-Json -Depth 5 | Set-Content "$bases/piko-windows-x64-$version-files.json" -Encoding utf8NoBOM
            }
          }

      # windows-2022-portable 拿同一份包，不再重打
      - id: upload-dist
        uses: actions/upload-artifact@v6
        with:
          name: windows-smoke-dist
          path: smoke-dist
          compression-level: 0
          retention-days: 3

      - name: Install, update and system integration
        shell: pwsh
        run: >
          ./desktopApp/package/package-smoke/windows.ps1
          -Base smoke-dist/9.9.0 -Next smoke-dist/9.9.1 -BaseVersion 9.9.0 -NextVersion 9.9.1
          -PackageName $env:SMOKE_PACKAGE -UpgradeCode $env:SMOKE_UPGRADE_CODE -Work "$env:RUNNER_TEMP/package-smoke"

      - name: Upload logs
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: windows-package-smoke-logs
          path: ${{ runner.temp }}/package-smoke/logs
          if-no-files-found: ignore

  # 已发布的 1.0.0、1.1.0（便携 zip 与 MSI）直接升级到这次构建：见 package-smoke/legacy.ps1。
  # 以正式包名与 UpgradeCode 独立构建 9.9.1（不依赖 windows-package，开场即并行启动，消除 16 分钟串行等待）：
  # 1.1.0 的清单作对照（-PpikoUpdateBases），1.0.0 只作核对（-PpikoUpdateRetired），并出 -from-1.1.0.zip 验差分升级；
  # 1.0.0 的 MSI 版走 msiexec，便携版只给下载页。
  windows-legacy-upgrade:
    if: inputs.desktop == true
    runs-on: windows-2022
    timeout-minutes: 90
    steps:
      # legacy.ps1 从 git 取 v1.0.0 的更新脚本，要有 tag
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: actions/checkout@v5
        if: format('{0}', inputs.sdk-main) != 'false'
        with:
          repository: NihilDigit/pikpak-kotlin
          path: pikpak-kotlin

      - name: Build against the SDK source
        if: format('{0}', inputs.sdk-main) != 'false'
        shell: bash
        run: echo "pikpak.sdk.dir=pikpak-kotlin" >> local.properties

      - uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: zulu

      - uses: gradle/actions/setup-gradle@v5

      - name: Old releases
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Force -Path old-releases, old-bases, old-retired | Out-Null
          foreach ($version in @('1.0.0', '1.1.0')) {
            gh release download "v$version" --repo $env:GITHUB_REPOSITORY --dir old-releases `
              -p "piko-windows-x64-$version.zip" -p "piko-windows-x64-$version.msi" -p "piko-windows-x64-$version-files.json"
            if ($LASTEXITCODE -ne 0) { throw "download v$version failed" }
            # 照 update-bases.sh 分开：1.0.0 不作对照，只核对它走不了补丁
            $target = if ($version -eq '1.0.0') { 'old-retired' } else { 'old-bases' }
            Copy-Item "old-releases/piko-windows-x64-$version-files.json" "$target/"
          }

      - name: Install WiX Toolset
        continue-on-error: true
        run: choco install wixtoolset -y --no-progress

      - name: Build 9.9.1 against the old releases
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          .\gradlew.bat :desktopApp:packageReleaseMsi :desktopApp:packageReleaseUpdate --no-daemon --stacktrace `
            "-PpikoDesktopVersion=9.9.1" "-PpikoUpdateBases=old-bases" "-PpikoUpdateRetired=old-retired"
          if ($LASTEXITCODE -ne 0) { throw 'build failed' }
          $binaries = 'desktopApp/build/compose/binaries/main-release'
          New-Item -ItemType Directory -Force -Path legacy-next | Out-Null
          Copy-Item "$binaries/update/*" legacy-next/
          Copy-Item "$binaries/msi/Piko-9.9.1.msi" legacy-next/piko-windows-x64-9.9.1.msi

      # 与 release.yml 同一个脚本，只出 x64。runner 与 Git Bash 都没有 zip，换成 zip_stored.py
      - name: Delta from 1.1.0
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          command -v zstd || choco install zstandard -y --no-progress
          shim=$(cygpath -u "$RUNNER_TEMP")/zip-shim
          mkdir -p "$shim"
          printf '#!/bin/sh\nexec python "%s" "$@"\n' "$PWD/desktopApp/package/package-smoke/zip_stored.py" > "$shim/zip"
          chmod +x "$shim/zip"
          PATH="$shim:$PATH" RUNNER_TEMP=$(cygpath -u "$RUNNER_TEMP") PIKO_DELTA_BASES=1.1.0 bash .github/scripts/delta-updates.sh 9.9.1 legacy-next x64
          test -f legacy-next/piko-windows-x64-9.9.1-from-1.1.0.zip

      - name: Old releases update to this build
        shell: pwsh
        run: >
          ./desktopApp/package/package-smoke/legacy.ps1
          -Next legacy-next -NextVersion 9.9.1
          -Old old-releases -Work "$env:RUNNER_TEMP/legacy-smoke" -Delta

      - name: Upload logs
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: windows-legacy-upgrade-smoke-logs
          path: ${{ runner.temp }}/legacy-smoke/logs
          if-no-files-found: ignore

  # 旧一代 Windows（Server 2022，与 Win10 21H2/22H2 同代内核）上的便携版更新：直接复用 windows-package 已构建的
  # windows-smoke-dist，无需配置 JDK 或 Gradle，约 3 分钟验完无 7z 依赖的补丁、Range 与回滚路径。
  windows-2022-portable:
    if: inputs.desktop == true && !cancelled() && needs.windows-package.outputs.dist-uploaded == 'true'
    needs: [windows-package]
    runs-on: windows-2022
    timeout-minutes: 30
    env:
      SMOKE_UPGRADE_CODE: 5f3c2b1e-7a4d-4c9e-9b8a-2d6e0f1a3c55
      SMOKE_PACKAGE: PikoSmoke
    steps:
      - uses: actions/checkout@v5

      - uses: actions/download-artifact@v7
        with:
          name: windows-smoke-dist
          path: smoke-dist

      - name: System tar
        shell: pwsh
        run: |
          $version = & "$env:SystemRoot\System32\tar.exe" --version
          $version
          "- Runner: $((Get-CimInstance Win32_OperatingSystem).Caption) build $([Environment]::OSVersion.Version.Build); system tar: $($version | Select-Object -First 1)" >> $env:GITHUB_STEP_SUMMARY

      - name: Portable update
        shell: pwsh
        run: >
          ./desktopApp/package/package-smoke/windows.ps1 -PortableOnly
          -Base smoke-dist/9.9.0 -Next smoke-dist/9.9.1 -BaseVersion 9.9.0 -NextVersion 9.9.1
          -PackageName $env:SMOKE_PACKAGE -UpgradeCode $env:SMOKE_UPGRADE_CODE -Work "$env:RUNNER_TEMP/package-smoke"

      - name: Upload logs
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: windows-2022-portable-smoke-logs
          path: ${{ runner.temp }}/package-smoke/logs
          if-no-files-found: ignore

  # macOS 同样打两个 DMG，从 DMG 装进 ~/Applications，再让它整包换成新的；装好之后同样验默认打开方式
  # 与系统送来的链接（openURI、openFiles）。见 package-smoke/macos.sh
  macos-package:
    if: inputs.desktop == true
    runs-on: macos-15
    timeout-minutes: 90
    env:
      SMOKE_PACKAGE: PikoSmoke
    steps:
      - uses: actions/checkout@v5

      - uses: actions/checkout@v5
        if: format('{0}', inputs.sdk-main) != 'false'
        with:
          repository: NihilDigit/pikpak-kotlin
          path: pikpak-kotlin

      - name: Build against the SDK source
        if: format('{0}', inputs.sdk-main) != 'false'
        shell: bash
        run: echo "pikpak.sdk.dir=pikpak-kotlin" >> local.properties

      - uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: zulu

      - uses: gradle/actions/setup-gradle@v5

      - name: Build two versions
        run: |
          set -euo pipefail
          for version in 9.9.0 9.9.1; do
            ./gradlew :desktopApp:packageReleaseDmg --no-daemon --stacktrace \
              "-PpikoDesktopVersion=$version" "-PpikoDesktopPackageName=$SMOKE_PACKAGE"
            mkdir -p "smoke-dist/$version"
            # 按版本号取：上一轮的 DMG 可能还留在同一个目录里
            cp "desktopApp/build/compose/binaries/main-release/dmg/$SMOKE_PACKAGE-$version.dmg" "smoke-dist/$version/piko-macos-arm64-$version.dmg"
          done
          ls -lR smoke-dist

      - name: Install, update and system integration
        run: bash desktopApp/package/package-smoke/macos.sh smoke-dist/9.9.0 smoke-dist/9.9.1 9.9.0 9.9.1 "$SMOKE_PACKAGE" "$RUNNER_TEMP/package-smoke"

      - name: Upload logs
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: macos-package-smoke-logs
          path: ${{ runner.temp }}/package-smoke/logs
          if-no-files-found: ignore

  # Linux 打两个 AppImage，拷进 ~/Applications 启动，让它按 zsync 只下变了的块、换成新的；装好之后同样验
  # 默认打开方式（.desktop 加 xdg-mime）与 xdg-open 送来的链接。见 package-smoke/linux.sh。
  # 没有显示器，打包（AOT 训练）与冒烟都套一层 xvfb-run
  linux-package:
    if: inputs.desktop == true
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v5

      - uses: actions/checkout@v5
        if: format('{0}', inputs.sdk-main) != 'false'
        with:
          repository: NihilDigit/pikpak-kotlin
          path: pikpak-kotlin

      - name: Build against the SDK source
        if: format('{0}', inputs.sdk-main) != 'false'
        shell: bash
        run: echo "pikpak.sdk.dir=pikpak-kotlin" >> local.properties

      - uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: zulu

      - uses: gradle/actions/setup-gradle@v5

      # fuse3 挂载 AppImage；xdg-utils 与 desktop-file-utils 是默认打开方式那一段要的
      - name: Install tools
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends zsync appstream desktop-file-utils xvfb xauth xdg-utils fuse3

      - name: Build two versions
        run: |
          set -euo pipefail
          for version in 9.9.0 9.9.1; do
            xvfb-run -a ./gradlew :desktopApp:packageReleaseAppImage --no-daemon --stacktrace "-PpikoDesktopVersion=$version"
            mkdir -p "smoke-dist/$version"
            cp desktopApp/build/compose/binaries/main-release/appimage/piko-linux-x64-"$version".AppImage* "smoke-dist/$version/"
          done
          ls -lR smoke-dist

      - name: Install, update and system integration
        run: xvfb-run -a bash desktopApp/package/package-smoke/linux.sh smoke-dist/9.9.0 smoke-dist/9.9.1 9.9.0 9.9.1 "$RUNNER_TEMP/package-smoke"

      - name: Upload logs
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: linux-package-smoke-logs
          path: ${{ runner.temp }}/package-smoke/logs
          if-no-files-found: ignore
