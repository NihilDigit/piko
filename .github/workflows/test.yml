name: Test

# 全部测试，发版之前必须全绿：release.yml 的第一个 job 就是调这里，通过后才开始打正式包。
#
# 两类：
# - 业务逻辑的单测放在 JVM 上：shared 的 desktop 测试（解析、代理、同步、更新来源等，Linux 上跑得最快）、
#   desktopApp 的测试（WinRT、窗口过程、更新清单，只能在 Windows 上跑）、Android 的单测。
# - 原生行为的冒烟在真机器上：Android 模拟器上的真实 libmpv 与回环代理；Windows、macOS 与 Linux 上真装、
#   真启动、真的应用内更新，再验依赖系统真实行为的（默认打开方式、在资源管理器中显示），
#   断言落到磁盘与系统上的结果（windows-package、macos-package、linux-package）。
#
# 推送与 PR 时不跑三个桌面冒烟：它们要打两遍安装包，一次二十来分钟。手动触发与发版时都跑。

on:
  push:
    # cla-signatures 只存 CLA 签名（cla.yml），每签一次就是一次推送，不是代码。
    # 同一事件不能同时写 branches 与 branches-ignore，排除用 ! 写进同一个列表
    branches: ['**', '!cla-signatures']
  pull_request:
  workflow_dispatch:
    inputs:
      desktop:
        description: 同时跑桌面端的安装与更新冒烟
        type: boolean
        default: true
      sdk-main:
        description: 使用 SDK main 源码（关闭则使用已发布版本）
        type: boolean
        default: true
  workflow_call:
    inputs:
      desktop:
        type: boolean
        default: true
      # 发版时用 libs.versions.toml 里已发布的 SDK，与正式构建一致。平时用 SDK main 的源码，见
      # settings.gradle.kts 的复合构建：SDK 在 Piko 发版之前才发，两次发版之间 Piko 会用到它还没发布的改动。
      # 各步骤按 format('{0}', inputs.sdk-main) != 'false' 判断：push 与 PR 没有这个输入，值为 null，
      # 而表达式里 null 与 false 宽松比较相等，直接写 inputs.sdk-main != false 会把平时的构建也换成已发布的 SDK
      sdk-main:
        type: boolean
        default: true

concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  jvm:
    # 代理与共用 state holder 的冒烟、以及大部分业务逻辑的单测都在 shared 的 desktop 测试里，
    # 不依赖 Windows，放 Linux 上跑得最快
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - uses: actions/checkout@v5
        if: format('{0}', inputs.sdk-main) != 'false'
        with:
          repository: NihilDigit/pikpak-kotlin
          path: pikpak-kotlin

      - name: Build against the SDK source
        if: format('{0}', inputs.sdk-main) != 'false'
        shell: bash
        run: echo "pikpak.sdk.dir=pikpak-kotlin" >> local.properties

      - uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: temurin

      - uses: gradle/actions/setup-gradle@v5

      - name: Shared smoke tests
        run: ./gradlew :shared:desktopTest --no-daemon --stacktrace

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: jvm-smoke-reports
          path: shared/build/reports/tests/
          if-no-files-found: ignore

  # WinRT、窗口过程、更新清单与 Windows 原生库的用例只能在 Windows 上跑
  desktop-unit:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - uses: actions/checkout@v5
        if: format('{0}', inputs.sdk-main) != 'false'
        with:
          repository: NihilDigit/pikpak-kotlin
          path: pikpak-kotlin

      - name: Build against the SDK source
        if: format('{0}', inputs.sdk-main) != 'false'
        shell: bash
        run: echo "pikpak.sdk.dir=pikpak-kotlin" >> local.properties

      - uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: zulu

      # 停在 v5 的理由见 release.yml
      - uses: gradle/actions/setup-gradle@v5

      - name: Test
        run: .\gradlew.bat :desktopApp:desktopTest --no-daemon --stacktrace

      - name: Upload test report
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: desktop-test-report
          path: desktopApp/build/reports/tests
          retention-days: 7

  # 凭据存进钥匙串的行为（-U 覆盖、-i 的行长上限、锁着时的退出码）只能在真实的 macOS 上验，本地没有 Mac
  macos-keychain:
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      - uses: actions/checkout@v5
        if: format('{0}', inputs.sdk-main) != 'false'
        with:
          repository: NihilDigit/pikpak-kotlin
          path: pikpak-kotlin

      - name: Build against the SDK source
        if: format('{0}', inputs.sdk-main) != 'false'
        shell: bash
        run: echo "pikpak.sdk.dir=pikpak-kotlin" >> local.properties

      - uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: zulu

      - uses: gradle/actions/setup-gradle@v5

      - name: Keychain tests
        run: ./gradlew :shared:desktopTest --tests '*MacKeychainVaultTest*' --no-daemon --stacktrace

      # 锁着的钥匙串报什么退出码与错误要记下来，成败都打出测试的标准输出
      - name: Print test output
        if: always()
        run: cat shared/build/test-results/desktopTest/TEST-*MacKeychainVaultTest*.xml || true

  android-unit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - uses: actions/checkout@v5
        if: format('{0}', inputs.sdk-main) != 'false'
        with:
          repository: NihilDigit/pikpak-kotlin
          path: pikpak-kotlin

      - name: Build against the SDK source
        if: format('{0}', inputs.sdk-main) != 'false'
        shell: bash
        run: echo "pikpak.sdk.dir=pikpak-kotlin" >> local.properties

      - uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: temurin

      - uses: gradle/actions/setup-gradle@v5

      - name: Test
        run: ./gradlew :app:testDebugUnitTest --no-daemon --stacktrace

      - name: Upload test report
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: android-test-report
          path: app/build/reports/tests
          retention-days: 7

  android:
    # 模拟器是 x86_64，验证的是 libmpv 的 x86_64 .so；arm64 与 x86_64 出自同一套构建脚本，
    # 打包或格式覆盖出问题时两者一起坏，差异只在机型硬解，这部分 CI 本来就测不到。
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      # 34 覆盖前台服务类型、后台启动限制等新平台行为
      API_LEVEL: 34
    steps:
      - uses: actions/checkout@v5

      - uses: actions/checkout@v5
        if: format('{0}', inputs.sdk-main) != 'false'
        with:
          repository: NihilDigit/pikpak-kotlin
          path: pikpak-kotlin

      - name: Build against the SDK source
        if: format('{0}', inputs.sdk-main) != 'false'
        shell: bash
        run: echo "pikpak.sdk.dir=pikpak-kotlin" >> local.properties

      - uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: temurin

      - uses: gradle/actions/setup-gradle@v5

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Build test APKs
        # 先在模拟器外编好，模拟器启动的那段时间不被 Gradle 占着
        run: ./gradlew :app:assembleDebug :app:assembleDebugAndroidTest -Ppiko.enableAbiSplits=false --no-daemon --stacktrace

      - name: AVD cache
        uses: actions/cache@v5
        id: avd-cache
        with:
          path: |
            ~/.android/avd/*
            ~/.android/adb*
          key: avd-${{ env.API_LEVEL }}-x86_64-v1

      - name: Create AVD snapshot
        if: steps.avd-cache.outputs.cache-hit != 'true'
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ env.API_LEVEL }}
          arch: x86_64
          target: default
          force-avd-creation: false
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: false
          script: echo "AVD snapshot created"

      - name: Instrumented smoke tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ env.API_LEVEL }}
          arch: x86_64
          target: default
          force-avd-creation: false
          emulator-options: -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          script: ./gradlew :app:connectedDebugAndroidTest -Ppiko.enableAbiSplits=false --no-daemon --stacktrace

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: android-smoke-reports-api${{ env.API_LEVEL }}
          path: |
            app/build/reports/androidTests/
            app/build/outputs/androidTest-results/
          if-no-files-found: ignore

  # 全新安装与应用内更新：同一份源码打两个版本（9.9.0 与 9.9.1），装旧的、让它自己更新成新的，
  # 逐文件核对落盘结果。装好之后顺带验依赖系统真实行为的：设为 magnet 与 .torrent 的默认打开方式，
  # 系统真把链接交给 Piko，在资源管理器中显示下载的文件（包里的自检见 desktopApp SelfTest.kt）。
  # 场景与断言见 desktopApp/package/package-smoke/windows.ps1。用测试专用的 UpgradeCode 与包名打，与正式版互不认识
  windows-package:
    if: inputs.desktop == true
    runs-on: windows-latest
    timeout-minutes: 90
    env:
      SMOKE_UPGRADE_CODE: 5f3c2b1e-7a4d-4c9e-9b8a-2d6e0f1a3c55
      SMOKE_PACKAGE: PikoSmoke
    steps:
      - uses: actions/checkout@v5

      - uses: actions/checkout@v5
        if: format('{0}', inputs.sdk-main) != 'false'
        with:
          repository: NihilDigit/pikpak-kotlin
          path: pikpak-kotlin

      - name: Build against the SDK source
        if: format('{0}', inputs.sdk-main) != 'false'
        shell: bash
        run: echo "pikpak.sdk.dir=pikpak-kotlin" >> local.properties

      # 与 release.yml 相同用 Zulu：打包的 jlink 与 ProGuard 要 jmods
      - uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: zulu

      - uses: gradle/actions/setup-gradle@v5

      - name: Install WiX Toolset
        continue-on-error: true
        run: choco install wixtoolset -y --no-progress

      - name: Build two versions
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $binaries = 'desktopApp/build/compose/binaries/main-release'
          # 9.9.1 对照的旧版清单：9.9.0 的那份，把 runtime\release 的摘要改掉。两次构建的运行时逐字节相同，
          # 这样 9.9.1 才把一个运行时文件当成变了、装进补丁包，冒烟验得到「运行时变了照样走补丁」（update-bases.sh 同理）
          $bases = 'smoke-bases'
          foreach ($version in @('9.9.0', '9.9.1')) {
            $extra = @(if ($version -eq '9.9.1') { "-PpikoUpdateBases=$bases" })
            .\gradlew.bat :desktopApp:packageReleaseMsi :desktopApp:packageReleaseUpdate --no-daemon --stacktrace `
              "-PpikoDesktopVersion=$version" "-PpikoDesktopUpgradeUuid=$env:SMOKE_UPGRADE_CODE" "-PpikoDesktopPackageName=$env:SMOKE_PACKAGE" @extra
            if ($LASTEXITCODE -ne 0) { throw "build $version failed" }
            $out = "smoke-dist/$version"
            New-Item -ItemType Directory -Force -Path $out | Out-Null
            # 与 release.yml 的 Collect artifacts 同样的名字与打法，更新走的是同一条路。便携标记打完即删：
            # 下一轮的 MSI 从同一个应用目录打，留着它装出来的就成了便携版
            & .github/scripts/pack-portable.ps1 -AppDir "$binaries/app/$env:SMOKE_PACKAGE" -Output "$out/piko-windows-x64-$version.7z"
            # 按版本号取：上一轮的 MSI 可能还留在同一个目录里
            Copy-Item "$binaries/msi/$env:SMOKE_PACKAGE-$version.msi" "$out/piko-windows-x64-$version.msi"
            Copy-Item "$binaries/update/*" $out
            Get-ChildItem $out | Format-Table Name, Length
            if ($version -eq '9.9.0') {
              $manifest = Get-Content -Raw "$out/piko-windows-x64-$version-files.json" | ConvertFrom-Json
              ($manifest.files | Where-Object { $_.path -eq 'runtime/release' }).sha256 = '0' * 64
              New-Item -ItemType Directory -Force -Path $bases | Out-Null
              $manifest | ConvertTo-Json -Depth 5 | Set-Content "$bases/piko-windows-x64-$version-files.json" -Encoding utf8NoBOM
            }
          }

      # windows-2022 那个 job 拿同一份包，不再打一遍
      - uses: actions/upload-artifact@v6
        with:
          name: windows-smoke-dist
          path: smoke-dist
          retention-days: 3

      - name: Install, update and system integration
        shell: pwsh
        run: >
          ./desktopApp/package/package-smoke/windows.ps1
          -Base smoke-dist/9.9.0 -Next smoke-dist/9.9.1 -BaseVersion 9.9.0 -NextVersion 9.9.1
          -PackageName $env:SMOKE_PACKAGE -UpgradeCode $env:SMOKE_UPGRADE_CODE -Work "$env:RUNNER_TEMP/package-smoke"

      - name: Upload logs
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: windows-package-smoke-logs
          path: ${{ runner.temp }}/package-smoke/logs
          if-no-files-found: ignore

  # 旧一代 Windows 上的便携版更新：Windows Server 2022（build 20348）与 Windows 10 21H2/22H2 同一代内核与系统组件，
  # GitHub 托管的镜像里没有 Windows 10，拿它近似。并不等价：桌面组件、资源管理器与 tar.exe 的版本未必与 Win10 相同，
  # 真正的 Win10 要 self-hosted runner。验的是便携版更新全程不依赖 7z：补丁包带着变了的运行时文件照样走补丁，
  # 补丁对不上时干净地退回下载页；系统 tar.exe 能不能解便携包 .7z 记进 job 摘要（只关系到用户手动解压）。
  # 包取自 windows-package，不再打一遍；那边的冒烟失败不挡这里。
  # 另验已发布的 1.0.0、1.1.0（便携 zip 与 MSI）升级到这次构建：见 package-smoke/legacy.ps1。为此以正式的包名与
  # UpgradeCode 另打一个 9.9.1，用这两个版本的清单作对照（-PpikoUpdateBases），与 release.yml 经 update-bases.sh 的打法相同
  windows-package-legacy:
    if: inputs.desktop == true && !cancelled()
    needs: windows-package
    runs-on: windows-2022
    timeout-minutes: 75
    env:
      SMOKE_UPGRADE_CODE: 5f3c2b1e-7a4d-4c9e-9b8a-2d6e0f1a3c55
      SMOKE_PACKAGE: PikoSmoke
    steps:
      # legacy.ps1 从 git 取 v1.0.0 的更新脚本，要有 tag
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: actions/checkout@v5
        if: format('{0}', inputs.sdk-main) != 'false'
        with:
          repository: NihilDigit/pikpak-kotlin
          path: pikpak-kotlin

      - name: Build against the SDK source
        if: format('{0}', inputs.sdk-main) != 'false'
        shell: bash
        run: echo "pikpak.sdk.dir=pikpak-kotlin" >> local.properties

      - uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: zulu

      - uses: gradle/actions/setup-gradle@v5

      - name: Old releases
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Force -Path old-releases, old-bases | Out-Null
          foreach ($version in @('1.0.0', '1.1.0')) {
            gh release download "v$version" --repo $env:GITHUB_REPOSITORY --dir old-releases `
              -p "piko-windows-x64-$version.zip" -p "piko-windows-x64-$version.msi" -p "piko-windows-x64-$version-files.json"
            if ($LASTEXITCODE -ne 0) { throw "download v$version failed" }
            Copy-Item "old-releases/piko-windows-x64-$version-files.json" old-bases/
          }

      - name: Build 9.9.1 against the old releases
        shell: pwsh
        run: |
          .\gradlew.bat :desktopApp:packageReleaseUpdate --no-daemon --stacktrace "-PpikoDesktopVersion=9.9.1" "-PpikoUpdateBases=old-bases"
          if ($LASTEXITCODE -ne 0) { throw 'build failed' }

      - name: Old releases update to this build
        shell: pwsh
        run: >
          ./desktopApp/package/package-smoke/legacy.ps1
          -Next desktopApp/build/compose/binaries/main-release/update -NextVersion 9.9.1
          -Old old-releases -Work "$env:RUNNER_TEMP/legacy-smoke"

      - uses: actions/download-artifact@v7
        with:
          name: windows-smoke-dist
          path: smoke-dist

      - name: System tar
        shell: pwsh
        run: |
          $version = & "$env:SystemRoot\System32\tar.exe" --version
          $version
          "- Runner: $((Get-CimInstance Win32_OperatingSystem).Caption) build $([Environment]::OSVersion.Version.Build); system tar: $($version | Select-Object -First 1)" >> $env:GITHUB_STEP_SUMMARY

      - name: Portable update
        shell: pwsh
        run: >
          ./desktopApp/package/package-smoke/windows.ps1 -PortableOnly
          -Base smoke-dist/9.9.0 -Next smoke-dist/9.9.1 -BaseVersion 9.9.0 -NextVersion 9.9.1
          -PackageName $env:SMOKE_PACKAGE -UpgradeCode $env:SMOKE_UPGRADE_CODE -Work "$env:RUNNER_TEMP/package-smoke"

      - name: Upload logs
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: windows-package-legacy-smoke-logs
          path: |
            ${{ runner.temp }}/package-smoke/logs
            ${{ runner.temp }}/legacy-smoke/logs
          if-no-files-found: ignore

  # macOS 同样打两个 DMG，从 DMG 装进 ~/Applications，再让它整包换成新的；装好之后同样验默认打开方式
  # 与系统送来的链接（openURI、openFiles）。见 package-smoke/macos.sh
  macos-package:
    if: inputs.desktop == true
    runs-on: macos-15
    timeout-minutes: 90
    env:
      SMOKE_PACKAGE: PikoSmoke
    steps:
      - uses: actions/checkout@v5

      - uses: actions/checkout@v5
        if: format('{0}', inputs.sdk-main) != 'false'
        with:
          repository: NihilDigit/pikpak-kotlin
          path: pikpak-kotlin

      - name: Build against the SDK source
        if: format('{0}', inputs.sdk-main) != 'false'
        shell: bash
        run: echo "pikpak.sdk.dir=pikpak-kotlin" >> local.properties

      - uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: zulu

      - uses: gradle/actions/setup-gradle@v5

      - name: Build two versions
        run: |
          set -euo pipefail
          for version in 9.9.0 9.9.1; do
            ./gradlew :desktopApp:packageReleaseDmg --no-daemon --stacktrace \
              "-PpikoDesktopVersion=$version" "-PpikoDesktopPackageName=$SMOKE_PACKAGE"
            mkdir -p "smoke-dist/$version"
            # 按版本号取：上一轮的 DMG 可能还留在同一个目录里
            cp "desktopApp/build/compose/binaries/main-release/dmg/$SMOKE_PACKAGE-$version.dmg" "smoke-dist/$version/piko-macos-arm64-$version.dmg"
          done
          ls -lR smoke-dist

      - name: Install, update and system integration
        run: bash desktopApp/package/package-smoke/macos.sh smoke-dist/9.9.0 smoke-dist/9.9.1 9.9.0 9.9.1 "$SMOKE_PACKAGE" "$RUNNER_TEMP/package-smoke"

      - name: Upload logs
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: macos-package-smoke-logs
          path: ${{ runner.temp }}/package-smoke/logs
          if-no-files-found: ignore

  # Linux 打两个 AppImage，拷进 ~/Applications 启动，让它按 zsync 只下变了的块、换成新的；装好之后同样验
  # 默认打开方式（.desktop 加 xdg-mime）与 xdg-open 送来的链接。见 package-smoke/linux.sh。
  # 没有显示器，打包（AOT 训练）与冒烟都套一层 xvfb-run
  linux-package:
    if: inputs.desktop == true
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v5

      - uses: actions/checkout@v5
        if: format('{0}', inputs.sdk-main) != 'false'
        with:
          repository: NihilDigit/pikpak-kotlin
          path: pikpak-kotlin

      - name: Build against the SDK source
        if: format('{0}', inputs.sdk-main) != 'false'
        shell: bash
        run: echo "pikpak.sdk.dir=pikpak-kotlin" >> local.properties

      - uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: zulu

      - uses: gradle/actions/setup-gradle@v5

      # fuse3 挂载 AppImage；xdg-utils 与 desktop-file-utils 是默认打开方式那一段要的
      - name: Install tools
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends zsync appstream desktop-file-utils xvfb xauth xdg-utils fuse3

      - name: Build two versions
        run: |
          set -euo pipefail
          for version in 9.9.0 9.9.1; do
            xvfb-run -a ./gradlew :desktopApp:packageReleaseAppImage --no-daemon --stacktrace "-PpikoDesktopVersion=$version"
            mkdir -p "smoke-dist/$version"
            cp desktopApp/build/compose/binaries/main-release/appimage/piko-linux-x64-"$version".AppImage* "smoke-dist/$version/"
          done
          ls -lR smoke-dist

      - name: Install, update and system integration
        run: xvfb-run -a bash desktopApp/package/package-smoke/linux.sh smoke-dist/9.9.0 smoke-dist/9.9.1 9.9.0 9.9.1 "$RUNNER_TEMP/package-smoke"

      - name: Upload logs
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: linux-package-smoke-logs
          path: ${{ runner.temp }}/package-smoke/logs
          if-no-files-found: ignore
