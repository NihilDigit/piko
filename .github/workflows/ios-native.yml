name: iOS Native validation

on:
  workflow_dispatch:
  push:
    branches: ["codex/ios-v1.4.0"]
    paths:
      - 'shared/**'
      - 'ui/**'
      - 'gradle/**'
      - '*.gradle.kts'
      - 'gradle.properties'
      - '.github/workflows/ios-native.yml'

permissions:
  contents: read

concurrency:
  group: ios-native-${{ github.ref }}
  cancel-in-progress: false

jobs:
  simulator-tests:
    runs-on: macos-15
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Locate Android SDK
        shell: bash
        run: |
          set -euo pipefail
          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-$HOME/Library/Android/sdk}}"
          test -d "$SDK"
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
      - uses: gradle/actions/setup-gradle@v5
      - name: Run iOS simulator tests
        shell: bash
        run: |
          set -euo pipefail
          chmod +x gradlew
          ./gradlew :shared:iosSimulatorArm64Test :ui:iosSimulatorArm64Test --no-daemon --stacktrace
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ios-simulator-test-results-${{ github.run_number }}
          path: |
            shared/build/reports/tests/
            shared/build/test-results/
            ui/build/reports/tests/
            ui/build/test-results/
          if-no-files-found: warn
          retention-days: 14
