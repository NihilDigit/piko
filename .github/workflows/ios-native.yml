name: iOS Native validation

# 可复用模拟器测试工作流：由 test.yml 在主干推送、PR 与发版门控中调用，也保留面板手动独立触发入口。
on:
  workflow_dispatch:
    inputs:
      sdk-main:
        description: 使用 SDK main 源码（关闭则使用已发布版本）
        type: boolean
        default: true
  workflow_call:
    inputs:
      sdk-main:
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-ios-native-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: ${{ github.event_name == 'workflow_dispatch' }}

jobs:
  simulator-tests:
    runs-on: macos-15
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v5

      - uses: actions/checkout@v5
        if: format('{0}', inputs.sdk-main) != 'false'
        with:
          repository: NihilDigit/pikpak-kotlin
          path: pikpak-kotlin

      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Xcode and Kotlin version
        id: xcode-ver
        shell: bash
        run: |
          echo "build=$(xcodebuild -version | awk '/Build version/ {print $3}')" >> "$GITHUB_OUTPUT"
          echo "kotlin=$(sed -n 's/^kotlin *= *"\([^"]*\)".*/\1/p' gradle/libs.versions.toml)" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Locate Android SDK
        shell: bash
        run: |
          set -euo pipefail
          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-$HOME/Library/Android/sdk}}"
          test -d "$SDK"
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
          printf 'sdk.dir=%s\n' "$SDK" > local.properties
          if [ -d pikpak-kotlin ]; then
            printf 'pikpak.sdk.dir=pikpak-kotlin\n' >> local.properties
            printf 'sdk.dir=%s\n' "$SDK" > pikpak-kotlin/local.properties
          fi

      # setup-gradle 只缓存 ~/.gradle，不缓存 ~/.konan（K/N 编译器、LLVM 与系统框架静态缓存）。
      # 按系统架构、Xcode 构建号与依赖版本哈希缓存，避免每次重下工具链并重编平台库缓存。
      - name: Cache Kotlin/Native
        uses: actions/cache@v5
        with:
          path: ~/.konan
          key: konan-v2-${{ runner.os }}-${{ runner.arch }}-${{ steps.xcode-ver.outputs.kotlin }}-${{ steps.xcode-ver.outputs.build }}-${{ hashFiles('gradle/libs.versions.toml', 'shared/src/nativeInterop/**', 'pikpak-kotlin/gradle/libs.versions.toml', 'pikpak-kotlin/src/**') }}
          restore-keys: |
            konan-v2-${{ runner.os }}-${{ runner.arch }}-${{ steps.xcode-ver.outputs.kotlin }}-${{ steps.xcode-ver.outputs.build }}-

      - uses: gradle/actions/setup-gradle@v5

      - name: Run iOS simulator tests
        shell: bash
        run: |
          set -euo pipefail
          chmod +x gradlew
          ./gradlew :shared:iosSimulatorArm64Test :ui:iosSimulatorArm64Test --no-daemon --console=plain --stacktrace

      - name: Build iOS 15 host
        shell: bash
        run: |
          set -euo pipefail
          command -v xcodegen >/dev/null || brew install xcodegen
          cd iosApp
          xcodegen generate
          xcodebuild -project Piko.xcodeproj -scheme Piko -configuration Debug \
            -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath "$RUNNER_TEMP/piko-ios" \
            ARCHS=arm64 ONLY_ACTIVE_ARCH=NO \
            CODE_SIGNING_ALLOWED=NO build 2>&1 | tee "$RUNNER_TEMP/piko-ios-build.log"
          APP="$RUNNER_TEMP/piko-ios/Build/Products/Debug-iphonesimulator/Piko.app"
          test -f "$APP/Piko"
          MIN_OS=$(/usr/libexec/PlistBuddy -c 'Print :MinimumOSVersion' "$APP/Info.plist")
          test "$MIN_OS" = '15.0'
          xcrun vtool -show-build "$APP/Piko" | tee "$RUNNER_TEMP/piko-ios-deployment.txt"

      - name: Launch simulator host
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os, subprocess
          runtimes = json.loads(subprocess.check_output(['xcrun', 'simctl', 'list', 'runtimes', '--json']))['runtimes']
          devices = json.loads(subprocess.check_output(['xcrun', 'simctl', 'list', 'devices', 'available', '--json']))['devices']
          choices = []
          for runtime in runtimes:
              if not runtime.get('isAvailable') or not runtime['identifier'].startswith('com.apple.CoreSimulator.SimRuntime.iOS-'):
                  continue
              for device in devices.get(runtime['identifier'], []):
                  if device.get('isAvailable') and device['name'].startswith('iPhone'):
                      choices.append((tuple(int(x) for x in runtime['version'].split('.') if x.isdigit()), runtime, device))
          assert choices, 'No available iPhone simulator'
          _, runtime, device = min(choices, key=lambda item: item[0])
          print('Selected simulator runtime:', runtime['version'])
          with open(os.environ['GITHUB_ENV'], 'a') as output:
              output.write(f"PIKO_SIMULATOR_ID={device['udid']}\n")
          if device['state'] != 'Booted':
              subprocess.run(['xcrun', 'simctl', 'boot', device['udid']], check=True)
          PY

      - name: Verify simulator launch
        shell: bash
        run: |
          set -euo pipefail
          xcrun simctl bootstatus "$PIKO_SIMULATOR_ID" -b
          xcrun simctl install "$PIKO_SIMULATOR_ID" "$RUNNER_TEMP/piko-ios/Build/Products/Debug-iphonesimulator/Piko.app"
          xcrun simctl launch --terminate-running-process "$PIKO_SIMULATOR_ID" dev.piko.pikpak.ios
          sleep 3
          found=0
          for _ in $(seq 1 15); do
            if xcrun simctl spawn "$PIKO_SIMULATOR_ID" launchctl list | awk '$1 ~ /^[0-9]+$/ && /dev\.piko\.pikpak\.ios/ { ok=1 } END { exit !ok }'; then
              found=1
              break
            fi
            sleep 1
          done
          test "$found" -eq 1

      - name: Upload test results
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: ios-simulator-test-results
          path: |
            shared/build/reports/tests/
            shared/build/test-results/
            ui/build/reports/tests/
            ui/build/test-results/
            ${{ runner.temp }}/piko-ios-build.log
            ${{ runner.temp }}/piko-ios-deployment.txt
          if-no-files-found: ignore
          retention-days: 7
