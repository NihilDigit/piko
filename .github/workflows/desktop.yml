name: Windows Desktop

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: windows-desktop-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  windows-x64:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: temurin

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build and test shared and desktop targets
        run: .\gradlew.bat test :shared:compileKotlinDesktop :desktopApp:packageUberJarForCurrentOS --no-daemon --stacktrace

      - name: Upload Windows x64 package
        uses: actions/upload-artifact@v4
        with:
          name: piko-windows-x64
          path: desktopApp/build/compose/jars/*windows-x64*.jar
          if-no-files-found: error
