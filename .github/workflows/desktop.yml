name: Windows Desktop

on:
  push:
    branches: [main]
    # tag 构建把版本号喂给 MSI 与 zip，并挂到 Android release.yml 建的 GitHub Release 上。
    tags:
      - 'v*'
  pull_request:

concurrency:
  group: windows-desktop-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  windows:
    strategy:
      fail-fast: false
      matrix:
        include:
          # x64：windows-latest 常备 runner，兜底架构。
          # 也用 Zulu 而不是 Temurin：Temurin 25 上 release 变体的 ProGuard 读不到
          # JDK 自身的类（报 can't find superclass java.lang.Object），它和 jlink
          # 都从 jmods 取 JDK 类库；Zulu 25 带 jmods，arm64 那一格因此一直能过
          - runner: windows-latest
            arch: x64
            java-distribution: zulu
          # arm64：用户主力机就是 ARM64 Windows；mpv/skiko 都有 windows-arm64，
          # 构建机 arch 会自动选中对的 runtime（见 desktopApp/build.gradle.kts）。
          # 注意 Temurin 不发 Windows-ARM64 的 25，只能用 Zulu。
          # 若仓库无权使用该 runner（一直排队），删掉这一段只留 x64。
          - runner: windows-11-arm
            arch: arm64
            java-distribution: zulu
    runs-on: ${{ matrix.runner }}
    permissions:
      # tag 构建要往 Release 挂安装包与 zip。
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: ${{ matrix.java-distribution }}

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Derive desktop version from tag
        shell: bash
        run: |
          if [[ "$GITHUB_REF_TYPE" == "tag" && "$GITHUB_REF_NAME" =~ ^v([0-9]+)\.([0-9]+)\.([0-9]+)$ ]]; then
            echo "PIKO_DESKTOP_VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"
            # Gradle 把 ORG_GRADLE_PROJECT_ 前缀的环境变量读作项目属性；只有带了它才标成发布构建
            echo "ORG_GRADLE_PROJECT_pikoDesktopVersion=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"
          else
            # 非 tag 构建走 build.gradle.kts 的默认版本，这里只用于附件命名
            echo "PIKO_DESKTOP_VERSION=1.0.0" >> "$GITHUB_ENV"
          fi

      - name: Build, test and stage portable package
        # 注意：windows-11-arm 镜像没有 Android SDK，所以这里只跑 shared/desktop 的测试，
        # 不用裸 test（会连带 :app:testDebugUnitTest，在 arm 上直接挂）。Android 单测归 Android 流水线。
        run: .\gradlew.bat :shared:desktopTest :desktopApp:desktopTest :shared:compileKotlinDesktop :desktopApp:packageUberJarForCurrentOS :desktopApp:createReleaseDistributable --no-daemon --stacktrace

      # 打包出的类逐个交给 JVM 校验。ProGuard 改写过的字节码可能校验不过，而那只在装上之后
      # 进到某一页才崩，gradle run 与单测都走不到（见 desktopApp/package/VerifyClasses.java）
      - name: Verify classes
        run: java -Xverify:all desktopApp/package/VerifyClasses.java desktopApp/build/compose/binaries/main-release/app/Piko/app

      - name: Install WiX Toolset (MSI only)
        continue-on-error: true
        run: choco install wixtoolset -y --no-progress

      - name: Build MSI installer and update artifacts
        # 未签名，安装时 SmartScreen 会提示。安装包元数据只能用 ASCII，见 build.gradle.kts 的 description。
        # 增量更新的清单与 app.zip 在同一次调用里生成，与 MSI 取自同一份应用目录
        run: .\gradlew.bat :desktopApp:packageReleaseMsi :desktopApp:packageReleaseUpdate --no-daemon --stacktrace

      - name: Stage release files (portable zip and installer)
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $appDir = 'desktopApp/build/compose/binaries/main-release/app/Piko'
          if (-not (Test-Path "$appDir/Piko.exe")) {
            throw "createReleaseDistributable output missing: $appDir/Piko.exe"
          }
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          $zip = "dist/piko-windows-${{ matrix.arch }}-$env:PIKO_DESKTOP_VERSION.zip"
          if (Test-Path $zip) { Remove-Item $zip }
          Compress-Archive -Path $appDir -DestinationPath $zip
          # 两个架构的 MSI 同名，按架构改名，挂到同一个 Release 上才不会互相覆盖
          $msi = Get-ChildItem 'desktopApp/build/compose/binaries/main-release/msi/*.msi' | Select-Object -First 1
          if (-not $msi) { throw 'packageReleaseMsi output missing' }
          Copy-Item $msi.FullName "dist/piko-windows-${{ matrix.arch }}-$env:PIKO_DESKTOP_VERSION.msi"
          # 应用内增量更新：files.json 与 app.zip，由 packageReleaseUpdate 按架构与版本命名
          Copy-Item 'desktopApp/build/compose/binaries/main-release/update/*' dist/
          Get-ChildItem dist | Format-Table Name, Length

      - name: Upload Windows portable jar
        uses: actions/upload-artifact@v4
        with:
          name: piko-windows-${{ matrix.arch }}-portable-jar
          path: desktopApp/build/compose/jars/*windows-*.jar
          if-no-files-found: error

      - name: Upload Windows portable zip
        uses: actions/upload-artifact@v4
        with:
          name: piko-windows-${{ matrix.arch }}-zip
          path: dist/piko-windows-${{ matrix.arch }}-${{ env.PIKO_DESKTOP_VERSION }}.zip
          if-no-files-found: error

      - name: Upload Windows installer
        uses: actions/upload-artifact@v4
        with:
          name: piko-windows-${{ matrix.arch }}-installer
          path: dist/*.msi
          if-no-files-found: error

      - name: Attach installer and zip to GitHub Release
        if: github.ref_type == 'tag'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Release 由 Android release.yml 创建，这里等它出现（最多等 5 分钟）再挂附件。
          for i in $(seq 1 10); do
            gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 && break
            sleep 30
          done
          # 清单最后上传：客户端见到清单才认这个版本，此前 app.zip 与 MSI 必须已经挂好
          gh release upload "$GITHUB_REF_NAME" dist/*.zip dist/*.msi --clobber
          gh release upload "$GITHUB_REF_NAME" dist/*-files.json --clobber
