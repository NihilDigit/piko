name: Windows Desktop

on:
  push:
    branches: [main]
    # 发版 tag 与 Android release.yml 共用 vMAJOR.MINOR.PATCH；
    # tag 构建会把版本号喂给 MSI/zip，并把 zip 挂到 GitHub Release 上。
    tags:
      - 'v*'
  pull_request:

concurrency:
  group: windows-desktop-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  windows:
    strategy:
      fail-fast: false
      matrix:
        include:
          # x64：windows-latest 常备 runner，兜底架构。
          - runner: windows-latest
            arch: x64
          # arm64：用户主力机就是 ARM64 Windows；mpv/skiko 都有 windows-arm64，
          # 构建机 arch 会自动选中对的 runtime（见 desktopApp/build.gradle.kts）。
          # 若仓库无权使用该 runner（一直排队），删掉这一段只留 x64。
          - runner: windows-11-arm
            arch: arm64
    runs-on: ${{ matrix.runner }}
    permissions:
      # tag 构建要往 Release 挂 zip 包。
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: temurin

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Derive desktop version from tag
        shell: bash
        run: |
          if [[ "$GITHUB_REF_TYPE" == "tag" && "$GITHUB_REF_NAME" =~ ^v([0-9]+)\.([0-9]+)\.([0-9]+)$ ]]; then
            echo "PIKO_DESKTOP_VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"
          else
            # 非 tag 构建走 build.gradle.kts 默认的 0.1.0（WiX 只认数字版本）。
            echo "PIKO_DESKTOP_VERSION=0.1.0" >> "$GITHUB_ENV"
          fi

      - name: Build, test and stage portable package
        run: .\gradlew.bat test :shared:compileKotlinDesktop :desktopApp:packageUberJarForCurrentOS :desktopApp:createDistributable -PpikoDesktopVersion="$env:PIKO_DESKTOP_VERSION" --no-daemon --stacktrace

      - name: Install WiX Toolset (MSI only)
        continue-on-error: true
        run: choco install wixtoolset -y --no-progress

      - name: Build MSI installer
        # MSI 仍在联调阶段（需 WiX+签名），失败不挡 zip 出包；红了单独修。
        continue-on-error: true
        run: .\gradlew.bat :desktopApp:packageMsi -PpikoDesktopVersion="$env:PIKO_DESKTOP_VERSION" --no-daemon --stacktrace

      - name: Zip portable package (exe + bundled JRE, no install)
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $appDir = 'desktopApp/build/compose/binaries/main/app/Piko'
          if (-not (Test-Path "$appDir/Piko.exe")) {
            throw "createDistributable output missing: $appDir/Piko.exe"
          }
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          $zip = "dist/piko-windows-${{ matrix.arch }}-$env:PIKO_DESKTOP_VERSION.zip"
          if (Test-Path $zip) { Remove-Item $zip }
          Compress-Archive -Path $appDir -DestinationPath $zip
          Get-Item $zip | Format-Table Name, Length

      - name: Upload Windows portable jar
        uses: actions/upload-artifact@v4
        with:
          name: piko-windows-${{ matrix.arch }}-portable-jar
          path: desktopApp/build/compose/jars/*windows-*.jar
          if-no-files-found: error

      - name: Upload Windows portable zip
        uses: actions/upload-artifact@v4
        with:
          name: piko-windows-${{ matrix.arch }}-zip
          path: dist/*.zip
          if-no-files-found: error

      - name: Upload Windows installer
        uses: actions/upload-artifact@v4
        with:
          name: piko-windows-${{ matrix.arch }}-installer
          path: desktopApp/build/compose/binaries/main/msi/*.msi
          # MSI 联调中：没有产出只告警，不 fail（zip 已经是必出的）。
          if-no-files-found: warn

      - name: Attach zip to GitHub Release
        if: github.ref_type == 'tag'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Release 由 Android release.yml 创建，这里等它出现（最多等 5 分钟）再挂附件。
          for i in $(seq 1 10); do
            gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 && break
            sleep 30
          done
          gh release upload "$GITHUB_REF_NAME" dist/*.zip --clobber
