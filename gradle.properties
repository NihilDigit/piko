org.gradle.jvmargs=-Xmx4g -Xms512m -XX:MaxMetaspaceSize=1g -XX:+UseParallelGC -Dfile.encoding=UTF-8
kotlin.daemon.jvmargs=-Xmx3g -Xms256m -XX:MaxMetaspaceSize=1g -XX:+UseParallelGC
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true
org.gradle.tooling.parallel=true
kotlin.incremental=true
kotlin.incremental.multiplatform=true
android.useAndroidX=true
# The SQLite cinterop is consumed from the shared iosMain source set.
kotlin.mpp.enableCInteropCommonization=true
kotlin.native.ignoreDisabledTargets=true
kotlin.native.enableKlibsCrossCompilation=false
# 开发期 Compose Hot Reload 统一使用 JBR 25（与 desktopApp 的 JDK 25 FFM 对齐；Release 打包仍锁定 Zulu 25）
compose.reload.jbr.version=25
